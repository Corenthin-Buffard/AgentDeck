<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Per-session token injected by the daemon; the upload POST carries it as ?token=. -->
<meta name="ad-token" content="__AD_TOKEN__">
<title>AgentDeck · Master Inbox</title>
<!-- Favicon: the same deck glyph as the header, inline so the binary stays
     self-contained (no extra file, no server route). Hex is hard-coded because
     a data: URI can't read CSS variables. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect x='1' y='3' width='18' height='3' rx='1.5' fill='%238b97a3'/%3E%3Crect x='1' y='8.5' width='13' height='3' rx='1.5' fill='%234dd0c7'/%3E%3Crect x='1' y='14' width='8' height='3' rx='1.5' fill='%238b97a3'/%3E%3C/svg%3E">
<style>
  :root{
    color-scheme:dark;
    --bg:#0d1117;--surface:#161b22;--line:#232b36;--line-soft:#1a212b;
    /* --faint is NON-TEXT only: it measures 4.10:1 here and 2.80:1 in the light
       theme, under the 4.5:1 (text) and 3.0:1 (UI) floors. Any text uses --dim
       or better — 7.71:1 dark, 5.59:1 light. */
    --text:#e6edf3;--dim:#9aa7b4;--faint:#6b7683;
    --accent:#4dd0c7;--accent-dim:#2b6f6b;
    /* --done also colours TEXT (.chip.done/.stopped/.resuming), so it obeys the
       same floor: 4.55:1 on its own 16% tint. It used to share --faint's hex and
       measured 3.13:1. Side effect: the done rail/dot sit slightly brighter. */
    --wait:#f5a623;--wait-bg:#2a2011;--err:#f85149;--err-bg:#2a1517;--ok:#3fb950;--done:#8c97a4;
    --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:light){:root{
    color-scheme:light;--bg:#f6f8fa;--surface:#fff;--line:#d6dde5;--line-soft:#e6ebf0;
    --text:#1c2128;--dim:#5a6570;--faint:#8b97a3;--accent:#157e77;--accent-dim:#9bd4cf;
    --wait:#b8770a;--wait-bg:#fdf3e0;--err:#cf222e;--err-bg:#fdeceb;--ok:#1a7f37;--done:#5d6975;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 20px 60px}
  /* Header in TWO rows on purpose. One flex row held six elements and needed two
     competing `margin-left:auto` (status + pills), which split the free space
     instead of pushing right — so the wordmark shifted as pills appeared, and the
     whole bar wrapped unpredictably below 620px. Identity on top, controls below:
     one auto-margin per row, and the brand never moves. */
  .idbar{display:flex;align-items:center;gap:10px;padding-bottom:11px}
  .ctlbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .brandmark{display:flex;align-items:center;gap:9px;min-width:0}
  .glyph{flex:none;color:var(--dim)}
  /* Rows of decreasing width read as a task deck. Three EQUAL bars would read as
     a hamburger menu — a navigation convention we must not borrow by accident. */
  .glyph .live{fill:var(--accent)}
  .mark{font-family:var(--mono);font-weight:700;font-size:19px;letter-spacing:-.5px;margin:0}
  /* --accent is "interactive / brand, used sparingly" (design system). It carries
     the glyph's live row and the primary button — not half the wordmark. */
  .sub{font-family:var(--mono);font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.3px}
  .idbar .sub{margin-left:auto}
  .conn-ok{color:var(--ok)}
  .conn-wait{color:var(--wait)}
  .conn-err{color:var(--err)}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--dim)}
  .pill .n{color:var(--text);font-weight:600}
  .pill.wait{border-color:var(--wait);color:var(--wait);background:var(--wait-bg)}
  .pill.err{border-color:var(--err);color:var(--err)}
  .dot{width:7px;height:7px;border-radius:50%}
  .dot.ok{background:var(--ok)}.dot.done{background:var(--done)}
  /* Daemon notices. Amber = degraded, red = broken — the same semantics the task
     rows and pills already carry, so the colour needs no separate legend. Body
     text stays --text (never --err/--faint) so both themes clear the 4.5:1 floor
     on the tinted background; the border carries the meaning. */
  .notices{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  /* An author `display` beats the UA's [hidden]{display:none}, so without this
     the container keeps its top margin and leaves a gap above the board on every
     healthy install — which is the normal case. */
  .notices[hidden]{display:none}
  .notice{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.45;padding:11px 13px;border-radius:8px;border:1px solid var(--wait);background:var(--wait-bg);color:var(--text)}
  .notice.error{border-color:var(--err);background:var(--err-bg)}
  .notice .ico{flex:none;font-family:var(--mono);font-weight:700;color:var(--wait);line-height:1.45}
  .notice.error .ico{color:var(--err)}
  .notice .msg{flex:1;min-width:0;overflow-wrap:anywhere}
  .notice .code{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--dim);margin-right:7px}
  .notice .x{flex:none;margin-left:auto;background:none;border:0;color:var(--dim);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:4px}
  .newbtn{font-family:var(--sans);font-weight:600;font-size:13px;cursor:pointer;padding:6px 13px;border-radius:6px;border:1px solid var(--accent);background:transparent;color:var(--accent)}
  /* Default IS the primary style — .newbtn is the call to action in every empty
     state. The secondary header button opts out via .ghost. */
  .newbtn.ghost{border-color:var(--line);color:var(--dim)}
  .newbtn:focus-visible,.projsel select:focus-visible,.notice .x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .actions{display:flex;gap:8px;align-items:center}
  .ctlbar .actions{margin-left:auto}
  /* project switcher — a compact native select, never a card grid */
  .projsel{display:inline-flex;align-items:center;gap:7px}
  .projsel .cap{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--dim)}
  .projsel select{font-family:var(--mono);font-size:12px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;max-width:220px}
  /* per-row project tag: muted mono text, distinct from the semantic status .chip */
  .proj{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
  .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);margin:22px 2px 9px}
  .rows{display:flex;flex-direction:column;gap:8px}
  .row{position:relative;display:grid;grid-template-columns:3px 1fr auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .rail{background:var(--done)}
  .row.running .rail{background:var(--ok)}.row.waiting .rail{background:var(--wait)}.row.error .rail{background:var(--err)}
  .row.waiting{border-color:var(--wait);background:var(--wait-bg)}
  .row.error{border-color:var(--err);background:var(--err-bg)}
  .row.done,.row.stopped{opacity:.62}
  .body{padding:13px 16px;min-width:0}
  .toprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .name{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .chip{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:5px;white-space:nowrap}
  .chip.running{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
  .chip.waiting{color:var(--wait);background:color-mix(in srgb,var(--wait) 22%,transparent)}
  .chip.error{color:var(--err);background:color-mix(in srgb,var(--err) 20%,transparent)}
  .chip.done,.chip.stopped,.chip.resuming{color:var(--done);background:color-mix(in srgb,var(--done) 16%,transparent)}
  .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  /* The error excerpt is now a real sentence (the agent's own stderr), not a
     50-char stub. Let it use the row but never push it wider — the full text is
     in the title attribute and, unabridged, in the drawer. */
  .errtxt{flex:1 1 22ch;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* An SVG, not a character. This used to be U+2442 (OCR FORK), which almost no
     installed font carries — most Linux boxes rendered a .notdef box on every
     task row, including in the README's demo GIF. */
  .meta .branch{color:var(--dim);display:inline-flex;align-items:center;gap:5px}
  .branch svg{flex:none}
  .qprev{margin-top:8px;font-size:13px;line-height:1.45;color:var(--wait);border-left:2px solid var(--wait);padding-left:9px}
  .hint{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .phases{display:flex;gap:4px;margin-top:11px}
  .seg{flex:1;min-width:0}
  .seg .bar{height:4px;border-radius:2px;background:var(--line-soft)}
  .seg.done .bar{background:var(--accent-dim)}
  .seg.active .bar{background:var(--accent)}
  .row.waiting .seg.active .bar{background:var(--wait)}.row.error .seg.active .bar{background:var(--err)}
  .seg .pl{font-family:var(--mono);font-size:9.5px;letter-spacing:.3px;text-transform:uppercase;color:var(--dim);margin-top:5px;text-align:center;white-space:nowrap}
  .seg.active .pl{color:var(--text);font-weight:600}
  /* Plan-review marks: a calm, monochrome CEO/Design/Eng row under the plan
     segment. Glyph SHAPE carries state (○ not-run, ✓ clean, ⚠ not-clean, trailing
     * = stale) so it reads without color; --dim/--faint (never the status colors
     --ok/--wait fill) keeps it quiet. A sibling of .pl, NOT a .pl, so the <620px
     rule that hides inactive .pl labels leaves these visible. */
  .seg .rvw{display:flex;flex-wrap:wrap;gap:0 7px;justify-content:center;margin-top:4px;font-family:var(--mono);font-size:9px;letter-spacing:.2px;line-height:1.6}
  .rvw .rv{white-space:nowrap;color:var(--dim);font-weight:400}
  .rvw .rv b{font-weight:700;margin-left:1px}
  .rvw .rv.none{color:var(--dim)}
  .rvw .rv.notclean b{color:var(--wait)}   /* a discreet warn tint on the glyph only, not the whole chip */
  .rvw .rv.eng{font-weight:600}            /* Eng emphasized — the required one that gates /ship */
  .aside{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:8px;padding:13px 16px;border-left:1px solid var(--line-soft);min-width:150px}
  .ago{font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .row.waiting .ago{color:var(--wait)}.row.error .ago{color:var(--err)}
  .btn{font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;padding:7px 14px;border-radius:6px;border:1px solid transparent;white-space:nowrap}
  .btn.primary{background:var(--wait);color:#14100a;border-color:var(--wait)}
  .btn.danger{background:transparent;color:var(--err);border-color:var(--err)}
  .btn.ghost{background:transparent;color:var(--dim);border-color:var(--line)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .empty{margin-top:26px;padding:22px;border:1px dashed var(--line);border-radius:8px;color:var(--dim);font-family:var(--mono);font-size:13px;text-align:center}
  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .15s}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,92vw);background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column;padding:20px;gap:14px;overflow:auto}
  .drawer.on{transform:translateX(0)}
  .drawer h2{font-family:var(--mono);font-size:16px;margin:0}
  .drawer .q{white-space:pre-wrap;font-family:var(--mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;color:var(--dim);max-height:40vh;overflow:auto}
  .drawer textarea,.drawer input{width:100%;font-family:var(--mono);font-size:13px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:10px}
  .drawer textarea{min-height:90px;resize:vertical}
  .drawer .close{position:absolute;top:14px;right:16px;cursor:pointer;color:var(--dim);background:none;border:none;font-size:20px}
  /* The agent's options, parsed out of its prose question. Full-width rows so the
     letter, the label and the pick marker read in one pass on a phone. */
  .opts{display:flex;flex-direction:column;gap:6px}
  .opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
       font-family:var(--mono);font-size:13px;color:var(--text);background:var(--bg);
       border:1px solid var(--line);border-radius:6px;padding:9px 11px}
  .opt b{flex:none;font-weight:700;color:var(--dim);min-width:1.1em}
  .opt span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .opt i{flex:none;font-style:normal;font-size:10.5px;letter-spacing:.3px;text-transform:uppercase;color:var(--accent)}
  .opt:hover{border-color:var(--accent-dim)}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* Picked: the reply box now holds this letter. Not "sent" — the operator still
     presses Send, which is what makes a mis-parse harmless. */
  .opt.on{border-color:var(--accent);color:var(--accent)}
  .opt.on b{color:var(--accent)}
  .drawer .field{display:flex;flex-direction:column;gap:6px}
  .drawer select{width:100%;font-family:var(--mono);font-size:13px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
  .drawer .err{color:var(--err);font-size:12.5px;font-family:var(--mono);line-height:1.4}
  .prog{width:100%;height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden}
  .prog>i{display:block;height:100%;width:0;background:var(--accent);transition:width .12s linear}
  /* toast — reuses the tokens; a path you copy, not an alert() to hand-retype */
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);max-width:min(560px,92vw);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:50}
  .toast.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  .toast .path{font-family:var(--mono);font-size:12px;color:var(--dim);word-break:break-all;min-width:0}
  .toast button{flex:none}
  /* Touch targets: the header controls measure 29px and 28px, under the 44px
     minimum. Enlarged only here — the desktop board trades on density, and a
     mouse doesn't need the extra area. */
  @media(max-width:620px){.row{grid-template-columns:3px 1fr}.aside{grid-column:2;border-left:0;border-top:1px solid var(--line-soft);flex-direction:row;align-items:center;justify-content:space-between;min-width:0}.seg .pl{display:none}.seg.active .pl{display:block}
    .newbtn{min-height:44px;padding:6px 16px}
    .opt{min-height:44px}
    .projsel{flex:1 1 auto;min-width:0}
    .notice .x{min-width:44px;min-height:44px}
    .projsel select{min-height:44px;flex:1 1 auto;max-width:none}}
</style>
</head>
<body>
<!-- Screen-reader announcements: an agent flipping to "needs you" must be heard,
     not just seen. Targeted messages (not the whole board re-render). -->
<div id="live" class="sr-only" aria-live="polite" aria-atomic="false"></div>
<div class="wrap">
  <header>
    <div class="idbar">
      <!-- div, not span: <span> is phrasing content and may not contain an <h1>. -->
      <div class="brandmark">
        <svg class="glyph" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <rect x="1" y="3" width="18" height="3" rx="1.5" fill="currentColor"/>
          <rect class="live" x="1" y="8.5" width="13" height="3" rx="1.5"/>
          <rect x="1" y="14" width="8" height="3" rx="1.5" fill="currentColor"/>
        </svg>
        <h1 class="mark">AgentDeck</h1>
      </div>
      <!-- Which deployment am I looking at, and is it alive. The agent counts
           live in the pills below; repeating them here would be noise. -->
      <span class="sub"><span id="host"></span> · <span id="conn" class="conn-wait">connecting…</span></span>
    </div>
    <div class="ctlbar">
      <label class="projsel"><span class="cap">Project</span>
        <select id="proj" aria-label="Filter tasks by project" onchange="onProjectChange(this.value)"></select></label>
      <div class="pills" id="pills"></div>
      <div class="actions">
        <button class="newbtn" onclick="openNew()">+ New task</button>
        <button class="newbtn ghost" onclick="openUpload()">↑ Upload</button>
      </div>
    </div>
  </header>
  <!-- Daemon-level notices: running as root, an empty project registry, a host
       gate that will 403 this browser. These used to exist only in journald,
       which is the one place someone debugging from a browser is not looking.
       Fed by the /ws `notices` frame, and by GET /api/health on load so it still
       appears when the socket handshake is being refused. Hidden when empty.
       Sits BELOW </header> on purpose: it joins neither header row, so it adds
       no second margin-left:auto (DESIGN.md, Header). -->
  <div id="notices" class="notices" hidden></div>
  <div id="board"></div>
</div>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <button class="close" onclick="closeDrawer()">×</button>
  <div id="drawerBody"></div>
</aside>

<div class="toast" id="toast" role="status"></div>

<script>
const PHASES=["plan","run","review","qa","ship","done"];
// Display caps for task.error and event rows. The daemon already caps task.error at
// 300 chars (STDERR_ERROR_MAX in src/agent.ts), so ERR_CARD sits under that budget
// and the drawer shows the untruncated value; EV_STDERR is roomier than EV_DEFAULT
// because a stderr row IS the crash.
const ERR_CARD_MAX=140, EV_STDERR_MAX=800, EV_DEFAULT_MAX=120;
// Branch mark. Drawn, not typed: the previous U+2442 character depends on a font
// that most systems don't ship, so it degraded to an empty box next to every
// branch name. Inherits currentColor, so it follows .branch in both themes.
const BRANCH_ICON=`<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true">`
  +`<path d="M3.5 10V4M3.5 7h2.5a2 2 0 0 0 2-2V4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>`
  +`<circle cx="3.5" cy="2.6" r="1.4" fill="currentColor"/><circle cx="8" cy="2.6" r="1.4" fill="currentColor"/></svg>`;
const AD_TOKEN=(document.querySelector('meta[name=ad-token]')||{}).content||"";
// Every state-changing request carries the dashboard token so the daemon accepts
// it (and a cross-origin page, which can't read this token, can't forge them).
function authHeaders(extra){return Object.assign({"x-agentdeck-token":AD_TOKEN},extra||{});}
let tasks=[];
let projects=[];               // [{id,label}] from /api/projects
let projectsReady=false;       // don't paint the board until we know the registry
let currentProject=localStorage.getItem("agentdeck.project")||"all";
let lastStatus={},announceSeeded=false;
function projLabel(id){const p=projects.find(x=>x.id===id);return p?p.label:id;}
// Append one node per message (aria-live announces added children) so a burst
// of transitions never clobbers a prior announcement before it's read.
function announce(msg){const el=document.getElementById("live");if(!el)return;const d=document.createElement("div");d.textContent=msg;el.appendChild(d);setTimeout(()=>d.remove(),6000);}
function announceTransitions(next){
  // Seed silently on first snapshot so a page load with N waiting agents doesn't
  // fire N announcements at once.
  if(!announceSeeded){for(const t of next)lastStatus[t.id]=t.status;announceSeeded=true;return;}
  for(const t of next){
    const prev=lastStatus[t.id];
    if(t.status!==prev){
      if(t.status==="waiting")announce(`${t.title} needs you.`);
      else if(t.status==="error")announce(`${t.title}: error.`);
      else if(t.status==="done"&&prev)announce(`${t.title} done.`);
    }
    lastStatus[t.id]=t.status;
  }
}
function ago(ts){const s=Math.max(0,Math.round((Date.now()-ts)/1000));if(s<60)return`${s}s ago`;const m=Math.round(s/60);if(m<60)return`${m}m ago`;return`${Math.round(m/60)}h ago`;}
function esc(s){return (s||"").replace(/[&<>"'`]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;","`":"&#96;"}[c]));}

// ── daemon notices ──────────────────────────────────────────────────────────
// Warnings are dismissible; errors are not. "Every task will fail" is not a
// thing to let someone hide from themselves.
let notices=[];
const NOTICE_KEY="agentdeck.notices.dismissed";
let noticesAnnounced={};
function dismissedNotices(){try{const v=JSON.parse(localStorage.getItem(NOTICE_KEY)||"[]");return Array.isArray(v)?v:[];}catch{return [];}}
// Keyed on code AND message: if the message changes (a different path, a new
// reason) that is new information and must resurface rather than stay hidden
// behind a dismissal of the old wording.
function noticeKey(n){return n.code+"|"+n.message;}
function dismissNotice(key){
  const d=dismissedNotices();
  if(!d.includes(key)){d.push(key);try{localStorage.setItem(NOTICE_KEY,JSON.stringify(d.slice(-40)));}catch{}}
  renderNotices();
}
function renderNotices(){
  const el=document.getElementById("notices");if(!el)return;
  const d=dismissedNotices();
  const shown=notices.filter(n=>n&&n.message&&(n.level==="error"||!d.includes(noticeKey(n))));
  el.hidden=!shown.length;
  el.innerHTML=shown.map(n=>{
    const err=n.level==="error";
    // The dismiss key travels in a data- attribute, NOT interpolated into the
    // onclick string: esc() turns ' into &#39;, which the HTML parser decodes
    // back to a quote before the JS is parsed, breaking out of the literal.
    // Same reason the reply-drawer options use data-letter.
    return `<div class="notice${err?" error":""}">`
      +`<span class="ico" aria-hidden="true">${err?"✕":"⚠"}</span>`
      +`<span class="msg"><span class="code">${esc(n.code)}</span>${esc(n.message)}</span>`
      +(err?"":`<button class="x" data-key="${esc(noticeKey(n))}" onclick="dismissNotice(this.dataset.key)" aria-label="Dismiss the ${esc(n.code)} notice" title="Dismiss">×</button>`)
      +`</div>`;
  }).join("");
  // Announce each error once on arrival, not on every re-render (DESIGN.md: an
  // error the operator must act on is exactly what #live exists for).
  for(const n of shown){
    if(n.level!=="error")continue;
    const k=noticeKey(n);
    if(noticesAnnounced[k])continue;
    noticesAnnounced[k]=1;announce(n.message);
  }
}
function setNotices(list){notices=Array.isArray(list)?list:[];renderNotices();}
// Also fetched on load, so the banner survives a refused /ws handshake — which
// is exactly the moment you most want to read it.
async function loadNotices(){
  // Token-gated half of /api/health: uid + the notice messages. Without the header
  // we would get liveness only and the banner would stay empty.
  try{const d=await fetch("/api/health",{headers:authHeaders()}).then(r=>r.json());setNotices(d.notices);}
  catch{ /* daemon unreachable: the connection indicator already says so */ }
}
// One-line preview of a prose question for the agent row: prefer the last line
// with a "?", strip common markdown, truncate.
function preview(text,max){max=max||120;const lines=(text||"").split("\n").map(s=>s.trim()).filter(Boolean);let q=lines.slice().reverse().find(l=>l.includes("?"))||lines[lines.length-1]||"";q=q.replace(/[*_`#>]/g,"").trim();return q.length>max?q.slice(0,max-1).trimEnd()+"…":q;}

// ── plan-review marks (CEO/Design/Eng) ──
// Auto-detected from the branch's gstack review log by the daemon; rendered under
// the plan segment. Order CEO · Design · Eng, Eng emphasized (it gates /ship).
const RVW=[["ceo","CEO"],["design","Design"],["eng","Eng"]];
function reviewTitle(label,s){
  if(!s)return `${label} review: not run`;
  const base=s.status==="clean"?"clean":(s.detail||"ran (not clean)");
  const extra=s.status==="clean"&&s.detail?` — ${s.detail}`:"";
  return `${label} review: ${base}${extra}${s.stale?" (stale vs current HEAD)":""}`;
}
function reviewMarks(t){
  const pr=t.planReviews||{};
  const any=pr.ceo||pr.design||pr.eng;
  // Show in the plan phase (a reminder of what's left) OR once any review has run;
  // otherwise nothing — no noise on a task that never planned.
  if(t.phase!=="plan"&&!any)return "";
  return `<div class="rvw" role="group" aria-label="Plan reviews">`+RVW.map(([k,label])=>{
    const s=pr[k];
    const glyph=(!s?"○":s.status==="clean"?"✓":"⚠")+(s&&s.stale?"*":"");
    const cls="rv "+(k==="eng"?"eng ":"")+(!s?"none":s.status==="clean"?"clean":"notclean");
    const title=reviewTitle(label,s);
    // title (hover) AND aria-label (keyboard/touch/SR) both carry the detail — a
    // title alone isn't accessible. The visible label+glyph carry the base state.
    return `<span class="${cls}" title="${esc(title)}" aria-label="${esc(title)}">${esc(label)}<b>${esc(glyph)}</b></span>`;
  }).join("")+`</div>`;
}
function phaseBar(t){
  const idx=PHASES.indexOf(t.phase);
  return `<div class="phases">`+PHASES.map((p,i)=>{
    const cls=i<idx?"done":i===idx?"active":"";
    // Marks live inside the first (plan) seg as a sibling of .pl.
    return `<div class="seg ${cls}"><div class="bar"></div><div class="pl">${p}</div>${i===0?reviewMarks(t):""}</div>`;
  }).join("")+`</div>`;
}
function actions(t){
  if(t.status==="waiting")return `<button class="btn primary" onclick="reply('${t.id}')">Reply</button>`;
  if(t.status==="error")return `<button class="btn danger" onclick="openTask('${t.id}')">View logs</button>`;
  if(t.status==="done")return `<button class="btn ghost" onclick="del('${t.id}')">Clean up</button>`;
  return `<button class="btn ghost" onclick="openTask('${t.id}')">Open</button>`;
}
function rowHtml(t){
  return `<article class="row ${t.status}">
    <div class="rail"></div>
    <div class="body">
      <div class="toprow"><span class="name">${esc(t.title)}</span>
        <span class="chip ${t.status}">${t.status==="waiting"?"Waiting for user":t.status}</span>
        ${currentProject==="all"?`<span class="proj">▸ ${esc(projLabel(t.project))}</span>`:""}</div>
      <div class="meta"><span class="branch">${BRANCH_ICON}${esc(t.branch)}</span>
        <span>${esc(t.id)}</span>${t.error?`<span class="errtxt" title="${esc(t.error)}">${esc(t.error.slice(0,ERR_CARD_MAX))}</span>`:""}</div>
      ${t.status==="waiting"&&t.pendingQuestion?`<div class="qprev">${esc(preview(t.pendingQuestion))}</div>`:""}
      ${phaseBar(t)}
    </div>
    <div class="aside"><span class="ago">${ago(t.lastActivity)}</span>${actions(t)}</div>
  </article>`;
}
// Isolate each row: one task that throws must not blank the whole board.
function safeRow(t){try{return rowHtml(t);}catch(e){return `<article class="row error"><div class="rail"></div><div class="body"><div class="toprow"><span class="name">${esc((t&&t.title)||(t&&t.id)||"task")}</span><span class="chip error">render error</span></div></div><div class="aside"></div></article>`;}}
function section(title,list){
  if(!list.length)return "";
  return `<div class="lbl">${title}</div><div class="rows">${list.map(safeRow).join("")}</div>`;
}
function render(){
  if(!projectsReady)return; // avoid a misleading "no projects" flash before the registry loads
  const board=document.getElementById("board");
  // Empty state 1: the registry itself is empty (all paths dropped at boot).
  if(!projects.length){
    document.getElementById("pills").innerHTML="";
    board.innerHTML=`<div class="empty">No project configured.<br>Add a repo to <code>projects.json</code> in the data dir (or launch with <code>AGENTDECK_TARGET_REPO</code>), then reload.<br><br><button class="newbtn" onclick="location.reload()">Reload</button></div>`;
    return;
  }
  // Filter to the selected project BEFORE splitting into sections and counting
  // pills, so rows and counters always agree.
  const shown=currentProject==="all"?tasks:tasks.filter(t=>t.project===currentProject);
  const wait=shown.filter(t=>t.status==="waiting"||t.status==="error");
  const run=shown.filter(t=>t.status==="running"||t.status==="resuming");
  const done=shown.filter(t=>t.status==="done"||t.status==="stopped");
  const counts={waiting:shown.filter(t=>t.status==="waiting").length,error:shown.filter(t=>t.status==="error").length,
    running:run.length,done:done.length};
  document.getElementById("pills").innerHTML=
    (counts.waiting?`<span class="pill wait"><span class="n">${counts.waiting}</span> waiting</span>`:"")+
    (counts.error?`<span class="pill err"><span class="n">${counts.error}</span> error</span>`:"")+
    `<span class="pill"><span class="dot ok"></span><span class="n">${counts.running}</span> running</span>`+
    `<span class="pill"><span class="dot done"></span><span class="n">${counts.done}</span> done</span>`;
  if(!shown.length){
    // Empty state 2: this project has no tasks yet (or, in "all", nothing anywhere).
    board.innerHTML=currentProject==="all"
      ? `<div class="empty">No agents running yet.<br>Describe a task — AgentDeck creates the branch and worktree, then launches the agent and the gstack workflow.<br><br><button class="newbtn" onclick="openNew()">+ New task</button></div>`
      : `<div class="empty">No tasks in <b>${esc(projLabel(currentProject))}</b> yet.<br><br><button class="newbtn" onclick="openNew()">+ New task in ${esc(projLabel(currentProject))}</button></div>`;
    return;
  }
  board.innerHTML=section("Needs you",wait)+section("Cruising",run)+section("Done",done);
}
// Populate the header switcher from the registry; "all" + one option per project.
function renderSwitcher(){
  const sel=document.getElementById("proj");if(!sel)return;
  if(!projects.length){sel.innerHTML=`<option>No project — see README</option>`;sel.disabled=true;return;}
  sel.disabled=false;
  sel.innerHTML=`<option value="all">All projects</option>`+projects.map(p=>`<option value="${esc(p.id)}">${esc(p.label)}</option>`).join("");
  sel.value=currentProject;
}
function onProjectChange(v){
  currentProject=v;
  if(v==="all")localStorage.removeItem("agentdeck.project");else localStorage.setItem("agentdeck.project",v);
  render();
}
async function loadProjects(){
  try{const d=await fetch("/api/projects").then(r=>r.json());projects=Array.isArray(d.projects)?d.projects:[];}
  catch{projects=[];announce("Could not load projects.");}
  // A persisted choice may point at a project that's gone — fall back to "all".
  if(currentProject!=="all"&&!projects.some(p=>p.id===currentProject)){currentProject="all";localStorage.removeItem("agentdeck.project");}

// The project <select> for the New-task / Upload drawers. Omitted with a single
// project (no redundant choice); returns "" so callers fall back to the default.
function projectField(id,selected){
  if(projects.length<2)return "";

    <select id="${id}">${projects.map(p=>`<option value="${esc(p.id)}"${p.id===sel?" selected":""}>${esc(p.label)}</option>`).join("")}</select></div>`;

// ── drawer ──

function openNew(){

async function createTask(){

// ── upload (local → VPS) ──
const UPLOAD_MAX=25*1024*1024;
function openUpload(){
  if(!projects.length){announce("No project configured.");return;}
  showDrawer(`<h2>Upload a file to the VPS</h2>
    ${projectField("upproj",currentProject)}
    <div class="field"><label class="lbl" for="upfile">File</label><input id="upfile" type="file"></div>
    <label style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--dim);font-family:var(--mono)">
      <input type="checkbox" id="upcookie" style="width:auto"> QA browse-state → the repo's <code>.gstack/browse-states/</code></label>
    <div class="prog" id="upprog" hidden><i></i></div>
    <div class="err" id="uperr" aria-live="polite"></div>
    <div class="hint">Max 25 MB. Lands under <code>uploads/&lt;project&gt;/</code> on the VPS (or the browse-state dir).</div>
    <button class="btn primary" id="upbtn" onclick="doUpload()">Upload</button>`);
  setTimeout(()=>document.getElementById("upfile")?.focus(),50);
}
function doUpload(){
  const err=document.getElementById("uperr");err.textContent="";
  const fileEl=document.getElementById("upfile"),f=fileEl&&fileEl.files&&fileEl.files[0];
  if(!f){err.textContent="Choose a file first.";return;}
  if(f.size>UPLOAD_MAX){err.textContent=`File too large (max ${UPLOAD_MAX/1024/1024} MB).`;return;}
  const psel=document.getElementById("upproj");
  const projectId=psel?psel.value:(projects[0]&&projects[0].id);
  const cookie=document.getElementById("upcookie");
  const dest=cookie&&cookie.checked?".gstack/browse-states":"";
  const fd=new FormData();fd.append("file",f);fd.append("project",projectId);fd.append("dest",dest);
  const btn=document.getElementById("upbtn");btn.disabled=true;
  const prog=document.getElementById("upprog");prog.hidden=false;const bar=prog.querySelector("i");bar.style.width="0%";
  // XHR (not fetch) for a determinate upload progress bar.
  const xhr=new XMLHttpRequest();
  xhr.open("POST","/api/upload");
  xhr.setRequestHeader("x-agentdeck-token",AD_TOKEN); // token in a header, not the URL (no cache/log leak)
  xhr.upload.onprogress=(e)=>{if(e.lengthComputable)bar.style.width=Math.round(e.loaded/e.total*100)+"%";};
  xhr.onload=()=>{
    btn.disabled=false;prog.hidden=true;
    let j={};try{j=JSON.parse(xhr.responseText);}catch{}
    if(xhr.status>=200&&xhr.status<300&&j.path){closeDrawer();showToast(j.path);announce("Upload complete: "+j.path);}
    else{err.textContent=j.error||`Upload failed (${xhr.status}).`;announce("Upload failed.");}
  };
  xhr.onerror=()=>{btn.disabled=false;prog.hidden=true;err.textContent="Network error.";announce("Upload failed.");};
  xhr.send(fd);
}
// ── toast (upload result: a path you copy, not an alert to hand-retype) ──
let lastToastPath="",toastTimer=null;
function showToast(path){
  lastToastPath=path;

  el.innerHTML=`<span class="path">${esc(path)}</span>`
    +`<button class="btn ghost" onclick="copyPath()">Copy path</button>`
    +`<button class="btn ghost" onclick="hideToast()" aria-label="Dismiss">Dismiss</button>`;
  el.classList.add("on");

function hideToast(){document.getElementById("toast").classList.remove("on");}
function copyPath(){

// The agent's options, parsed server-side out of its prose question.
// Clicking one only PRE-FILLS the reply box: the brief stays on screen above and
// nothing is sent until Send. That is deliberate — this is a parser reading
// prose, so it will sometimes be wrong, and a wrong guess has to be visible and
// free rather than dispatched to an agent running with skipped permissions.
function optionList(t,id){
  const opts=(t.brief&&t.brief.options)||[];
  if(!opts.length)return "";
  return `<label class="lbl">The agent's options</label>
    <div class="opts">`+opts.map(o=>
      `<button class="opt${o.recommended?" rec":""}" data-letter="${esc(o.letter)}" onclick="pickOption('${id}',this)">`
      +`<b>${esc(o.letter)}</b><span>${esc(o.label)}</span>`
      +(o.recommended?`<i>recommended</i>`:``)+`</button>`).join("")+`</div>
    <div class="hint">Read off the question above — clicking fills your reply, it doesn't send it.</div>`;
}
function pickOption(id,btn){
  const ta=document.getElementById("ans");if(!ta)return;
  for(const b of document.querySelectorAll(".opt"))b.classList.toggle("on",b===btn);
  ta.value=btn.dataset.letter;
  ta.focus();
  ta.setSelectionRange(ta.value.length,ta.value.length); // caret after the letter, ready for a sentence
  announce(`Option ${btn.dataset.letter} put in your reply. Not sent yet.`);
}
function reply(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  showDrawer(`<h2>${esc(t.title)} needs you</h2>
    <div class="q">${esc(t.pendingQuestion||"(no question text)")}</div>
    ${optionList(t,id)}
    <label class="lbl">Your reply (injected via claude --resume)</label>
    <textarea id="ans" placeholder="Type your decision…" onkeydown="if((event.metaKey||event.ctrlKey)&&event.key==='Enter')sendAnswer('${id}')"></textarea>
    <div class="hint">⌘/Ctrl + Enter to send</div>
    <button class="btn primary" onclick="sendAnswer('${id}')">Send to agent</button>`);

}
async function sendAnswer(id){
  const text=document.getElementById("ans").value.trim();if(!text)return;
  const r=await fetch(`/api/tasks/${id}/answer`,{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify({text})});
  if(r.ok)closeDrawer();else alert("Error: "+(await r.json()).error);

async function openTask(id){
  const t=tasks.find(x=>x.id===id);
  const ev=await fetch(`/api/tasks/${id}/events`).then(r=>r.json()).catch(()=>({events:[]}));
  const df=await fetch(`/api/tasks/${id}/diff`).then(r=>r.json()).catch(()=>({diff:""}));
  // Cap the diff so a task touching many files can't bloat the drawer DOM (events
  // are already capped below). The full diff lives in the worktree.
  const diff=df.diff||"";
  const DIFF_CAP=4000;
  const diffShown=diff.length>DIFF_CAP?diff.slice(0,DIFF_CAP)+`\n… ${diff.length-DIFF_CAP} more chars truncated (see the worktree)`:diff;
  // Every interpolation below is esc()'d. It used to be safe to skip phase/status/id
  // because all three were daemon-generated (fixed enums, a t_+uuid), and TODOS.md
  // filed it as P4 defence-in-depth on exactly that reasoning. `error` retires it:
  // it now carries bytes an agent wrote to its own stderr, and that agent runs with
  // permissions skipped. Escape the lot rather than track which half is trusted.
  // Slice BEFORE esc, never after — truncating escaped text can cut `&#39;` in half.
  const evLine=(e)=>{
    // stderr rows are the crash itself, so give them room; the rest stay terse.
    const cap=e.kind==="stderr"?EV_STDERR_MAX:EV_DEFAULT_MAX;
    return `${new Date(e.ts).toLocaleTimeString()} · ${esc(e.kind)} · ${esc(String(e.data).slice(0,cap))}`;
  };
  showDrawer(`<h2>${esc(t.title)}</h2>
    <div class="meta"><span class="branch">${BRANCH_ICON}${esc(t.branch)}</span><span>phase ${esc(t.phase)}</span><span>${esc(t.status)}</span></div>
    ${t.error?`<label class="lbl">Error</label><div class="q">${esc(t.error)}</div>`:""}
    <label class="lbl">Diff</label><div class="q">${esc(diffShown||"(no changes)")}</div>
    <label class="lbl">Recent events</label>
    <div class="q">${ev.events.slice(-40).map(evLine).join("\n")||"(none)"}</div>
    <div style="display:flex;gap:8px">
      <button class="btn ghost" data-id="${esc(id)}" onclick="stop(this.dataset.id)">Pause</button>
      <button class="btn danger" data-id="${esc(id)}" onclick="del(this.dataset.id)">Delete</button></div>`);
}
async function stop(id){await fetch(`/api/tasks/${id}/stop`,{method:"POST",headers:authHeaders()});closeDrawer();}
async function del(id){
  const call=async(q)=>{try{return await (await fetch(`/api/tasks/${id}${q}`,{method:"DELETE",headers:authHeaders()})).json();}catch{return{removed:false,reason:"request failed"};}};
  // Try a safe removal first (refuses if the worktree holds the agent's uncommitted work).
  let j=await call("");
  if(j.removed){closeDrawer();return;}
  if(!j.dirty){alert(j.reason||"refused");return;}
  // The worktree has the agent's work and nothing else holds it. Offer a path forward.
  if(confirm("This task's worktree has the agent's uncommitted work.\n\nOK: commit it to the branch, then remove the worktree (work is kept on the branch).\nCancel: choose to discard instead.")){
    j=await call("?mode=commit");
    if(j.removed){closeDrawer();alert(j.reason||"Committed to the branch and cleaned up.");return;}
    alert((j.reason||"commit failed")+"\n\nYou can still discard it instead.");
    // fall through to the discard offer
  }
  if(confirm("Discard this task and force-remove it?\n\nThis permanently deletes the worktree AND the branch — including any committed-but-unmerged work, not just the uncommitted changes.")){
    j=await call("?mode=force");
    if(j.removed)closeDrawer();else alert(j.reason||"refused");
  }
}

// ── live ──
// Three states that LOOK different, not just read differently. Restarting the
// daemon is routine, so a drop must read as "reconnecting" (amber) and never as
// an error (red). But retrying forever with one unchanging message hides the
// difference between a two-second blip and a daemon that never came back — so
// after GIVE_UP_AFTER tries we say so, in red, once.
// Once we say "unreachable", back off to match — retrying every 1.5s forever
// while claiming to have given up is the UI lying about what the code does.
// Recovery is still automatic, just up to GIVE_UP_MS late.
const RECONNECT_MS=1500, GIVE_UP_AFTER=8, GIVE_UP_MS=15000;
let connAttempts=0;
function setConn(text,cls){const el=document.getElementById("conn");if(!el)return;el.textContent=text;el.className=cls;}
function connect(){
  // Match the page's scheme: under an HTTPS reverse proxy (the V2 deployment
  // shape in the README) a hard-coded ws:// is blocked as mixed content, and the
  // board silently goes stale while REST keeps working.
  // The token gates the upgrade: /ws pushes the whole board on connect, and a
  // WebSocket is not protected by the same-origin policy. It travels as a
  // subprotocol (a header) rather than in the URL, which proxies would log.
  const ws=new WebSocket(`${location.protocol==="https:"?"wss":"ws"}://${location.host}/ws`,["agentdeck.v1",AD_TOKEN]);
  ws.onopen=()=>{connAttempts=0;setConn("live","conn-ok");};
  ws.onclose=()=>{
    connAttempts++;
    // Announce exactly once, on the crossing — not on every retry.
    if(connAttempts===GIVE_UP_AFTER)announce("Daemon unreachable.");
    setConn(connAttempts>=GIVE_UP_AFTER?"daemon unreachable":"reconnecting…",connAttempts>=GIVE_UP_AFTER?"conn-err":"conn-wait");
    setTimeout(connect,connAttempts>=GIVE_UP_AFTER?GIVE_UP_MS:RECONNECT_MS);
  };
  ws.onmessage=(m)=>{const d=JSON.parse(m.data);
    if(d.type==="tasks"){announceTransitions(d.tasks);tasks=d.tasks;render();}
    // Sent on every connect, including when empty — that empty frame is what
    // clears a stale banner in a tab left open across the restart that fixed it.
    else if(d.type==="notices"){setNotices(d.notices);}};
}
document.addEventListener("keydown",(e)=>{if(e.key!=="Escape")return;const a=document.activeElement;if(a&&a.tagName==="TEXTAREA"&&a.value.trim())return;hideToast();closeDrawer();});
// Which deployment this tab is pointed at — the one fact no other element carries
// when you keep several SSH tunnels open.
document.getElementById("host").textContent=location.host;
loadProjects();
