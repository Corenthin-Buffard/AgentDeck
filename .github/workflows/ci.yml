name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile || bun install
      - run: bun test
      # Exercise the exact cross-compile targets release.yml ships, so a broken
      # target fails the PR instead of the tag. arm64/darwin are compile-only
      # (can't run them on an x64 runner); linux-x64 is also smoke-run below.
      - name: Build binaries (all release targets)
        run: |
          mkdir -p dist
          bun build src/main.ts --compile --target=bun-linux-x64    --outfile dist/agentdeck-linux-x64
          bun build src/main.ts --compile --target=bun-linux-arm64  --outfile dist/agentdeck-linux-arm64
          bun build src/main.ts --compile --target=bun-darwin-arm64 --outfile dist/agentdeck-darwin-arm64
      # --version must answer WITHOUT booting or touching the disk. config.ts does
      # I/O at import (mkdir + token mint), so this also proves src/main.ts still
      # answers before that import happens — a regression here is silent otherwise.
      - name: Binary answers --version without side effects
        run: |
          export HOME="$(mktemp -d)"
          ./dist/agentdeck-linux-x64 --version | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "--version did not print a version"; exit 1; }
          [ -d "$HOME/.agentdeck" ] && { echo "--version created the data dir"; exit 1; }
          echo "OK: --version prints, creates nothing"
      # Prove the shipped artifact actually boots and serves the embedded
      # dashboard — compiling only proves the text import bundles, not that the
      # binary runs. The x64 target runs natively on this runner.
      - name: Smoke-test the linux-x64 binary
        run: |
          # GitHub runners do not ship Claude Code, and the daemon now raises an
          # error notice (ok:false) when `claude` is missing — correctly. Give it a
          # stub so the health assertion below tests the daemon, not the runner's
          # lack of an agent binary. On PATH rather than via AGENTDECK_CLAUDE_BIN:
          # overriding the variable would retire the only coverage of the DEFAULT
          # resolution (config.claudeBin = "claude", resolved through PATH), which
          # daemon.ts calls the single most common install mistake.
          mkdir -p /tmp/bin
          printf '#!/bin/sh\necho stub-claude\n' > /tmp/bin/claude
          chmod +x /tmp/bin/claude
          PATH=/tmp/bin:$PATH AGENTDECK_TARGET_REPO="$PWD" ./dist/agentdeck-linux-x64 &
          PID=$!
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/ 2>/dev/null | grep -q '<title>AgentDeck'; then ok=1; break; fi
            sleep 0.25
          done
          # A serving dashboard is not a working daemon — /api/health is what says
          # whether tasks can actually run. The runner has no `claude` on PATH, so
          # the daemon CORRECTLY reports ok:false with a claude-bin notice; the stub
          # placed on PATH above is what makes ok:true a meaningful assertion here.
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"ok":true' \
            || { echo "health reported not-ok:"; curl -s http://127.0.0.1:8787/api/health; kill $PID 2>/dev/null; exit 1; }
          kill $PID 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "binary did not serve the dashboard"; exit 1; }
          echo "smoke OK: binary boots, serves the dashboard, and reports healthy"
